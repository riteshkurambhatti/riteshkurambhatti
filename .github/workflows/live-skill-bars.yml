name: Update Live Skill Bars

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Update Skill Bars
        run: |
          get_percentage() {
            SKILL=$1
            TOTAL=$(gh repo list riteshkurambhatti --json name,defaultBranchRef --jq ".[] | select(.name|contains(\"$SKILL\")) | .defaultBranchRef.target.history.totalCount" | paste -sd+ | bc)
            if [ -z "$TOTAL" ]; then TOTAL=0; fi
            if [ "$TOTAL" -gt 100 ]; then TOTAL=100; fi
            echo $TOTAL
          }

          HTML=$(get_percentage "html")
          CSS=$(get_percentage "css")
          JS=$(get_percentage "js")
          REACT=$(get_percentage "react")
          JAVA=$(get_percentage "java")
          SPRING=$(get_percentage "spring")
          PYTHON=$(get_percentage "python")
          NODE=$(get_percentage "node")
          TENSOR=$(get_percentage "tensorflow")
          PYTORCH=$(get_percentage "pytorch")
          MYSQL=$(get_percentage "mysql")
          MONGO=$(get_percentage "mongo")

          sed -i "s|!\[HTML\](https://progress-bar.dev/.*)|![HTML](https://progress-bar.dev/${HTML}/?title=HTML&suffix=%25)|" README.md
          sed -i "s|!\[CSS\](https://progress-bar.dev/.*)|![CSS](https://progress-bar.dev/${CSS}/?title=CSS&suffix=%25)|" README.md
          sed -i "s|!\[JavaScript\](https://progress-bar.dev/.*)|![JavaScript](https://progress-bar.dev/${JS}/?title=JS&suffix=%25)|" README.md
          sed -i "s|!\[React\](https://progress-bar.dev/.*)|![React](https://progress-bar.dev/${REACT}/?title=React&suffix=%25)|" README.md
          sed -i "s|!\[Java\](https://progress-bar.dev/.*)|![Java](https://progress-bar.dev/${JAVA}/?title=Java&suffix=%25)|" README.md
          sed -i "s|!\[Spring Boot\](https://progress-bar.dev/.*)|![Spring Boot](https://progress-bar.dev/${SPRING}/?title=SpringBoot&suffix=%25)|" README.md
          sed -i "s|!\[Python\](https://progress-bar.dev/.*)|![Python](https://progress-bar.dev/${PYTHON}/?title=Python&suffix=%25)|" README.md
          sed -i "s|!\[Node.js\](https://progress-bar.dev/.*)|![Node.js](https://progress-bar.dev/${NODE}/?title=Node.js&suffix=%25)|" README.md
          sed -i "s|!\[TensorFlow\](https://progress-bar.dev/.*)|![TensorFlow](https://progress-bar.dev/${TENSOR}/?title=TensorFlow&suffix=%25)|" README.md
          sed -i "s|!\[PyTorch\](https://progress-bar.dev/.*)|![PyTorch](https://progress-bar.dev/${PYTORCH}/?title=PyTorch&suffix=%25)|" README.md
          sed -i "s|!\[MySQL\](https://progress-bar.dev/.*)|![MySQL](https://progress-bar.dev/${MYSQL}/?title=MySQL&suffix=%25)|" README.md
          sed -i "s|!\[MongoDB\](https://progress-bar.dev/.*)|![MongoDB](https://progress-bar.dev/${MONGO}/?title=MongoDB&suffix=%25)|" README.md

      - name: Commit & Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update skill bars automatically"
          git push
